<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task Manager</title>

<link rel="stylesheet" href="./bootstrap-5.3.8-dist/css/bootstrap.css">

<style>
body {
  background: #dbefff;
}

.card {
  border-radius: 12px;
}

.task-complete {
  text-decoration: line-through;
  color: gray;
}
</style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 400px;">

    <h3 class="text-center mb-3">Task Manager</h3>

    <!-- INPUT -->
    <div class="d-flex gap-2">
      <input type="text" id="taskinput" class="form-control" placeholder="Enter task">
      <button class="btn btn-primary" onclick="addTask()">Add</button>
    </div>

    <!-- FILTER BUTTONS -->
    <div class="d-flex justify-content-between mt-3">
      <button class="btn btn-sm btn-dark" onclick="filterTasks('all')">All</button>
      <button class="btn btn-sm btn-success" onclick="filterTasks('completed')">Completed</button>
      <button class="btn btn-sm btn-danger" onclick="filterTasks('pending')">Pending</button>
    </div>

    <!-- LIST -->
    <ul id="tasklist" class="list-group mt-3"></ul>

  </div>
</div>

<script>

let tasks = [];
let currentFilter = "all";

function renderTasks() {
  let list = document.getElementById("tasklist");
  list.innerHTML = "";

  tasks.forEach((task, index) => {

    if (currentFilter === "completed" && !task.done) return;
    if (currentFilter === "pending" && task.done) return;

    let li = document.createElement("li");
    li.className = "list-group-item d-flex justify-content-between align-items-center";

    li.innerHTML = `
      <span onclick="toggleTask(${index})" 
            style="cursor:pointer"
            class="${task.done ? 'task-complete' : ''}">
        ${task.text}
      </span>

      <button onclick="deleteTask(${index})" class="btn btn-sm btn-danger">X</button>
    `;

    list.appendChild(li);
  });
}

function addTask() {
  let input = document.getElementById("taskinput");
  let text = input.value.trim();

  if (text === "") return;

  tasks.push({ text: text, done: false });

  input.value = "";
  renderTasks();
}

function toggleTask(index) {
  tasks[index].done = !tasks[index].done;
  renderTasks();
}

function deleteTask(index) {
  tasks.splice(index, 1);
  renderTasks();
}

function filterTasks(type) {
  currentFilter = type;
  renderTasks();
}

</script>

</body>
</html>
